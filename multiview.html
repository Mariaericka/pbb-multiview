<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiview</title>
<style>
  :root{--bg:#14171a;--panel:#1d2227;--line:#2c343b;--text:#e8ecef;--dim:#8a96a0;--live:#ff4d4d;--accent:#4fd1c5}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
  header{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:15px;margin:0 auto 0 0;font-weight:600}
  button,select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
  button:hover{border-color:var(--accent)}
  #wall{flex:1;min-height:0;display:grid;gap:6px;padding:6px}
  .tile{position:relative;background:#000;border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .bar{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--panel);font-size:12px}
  .bar .dot{width:8px;height:8px;border-radius:50%;background:var(--live)}
  .bar .name{margin-right:auto;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar button{padding:2px 7px;font-size:12px}
  iframe{flex:1;width:100%;border:0;min-height:0;background:#000}
  .empty{flex:1;display:grid;place-items:center;color:var(--dim);text-align:center;padding:16px}
  /* layouts */
  .l-main{grid-template-columns:3fr 1fr;grid-template-rows:repeat(3,1fr)}
  .l-main .tile:first-child{grid-row:1/4}
  .l-grid{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
  .l-row{grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-template-rows:1fr}
  @media (max-width:800px){
    .l-main,.l-grid,.l-row{grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:minmax(240px,1fr)}
    .l-main .tile:first-child{grid-row:auto}
    #wall{overflow:auto}
  }
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;width:min(560px,92vw);padding:16px}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  label{display:block;margin:10px 0 3px;color:var(--dim)}
  input{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit}
  .row{display:grid;grid-template-columns:130px 1fr;gap:8px;margin-bottom:8px}
  .hint{color:var(--dim);font-size:12px;margin:8px 0 0}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>Multiview</h1>
  <select id="layout" aria-label="Layout">
    <option value="main">1 malaki + 3 maliit</option>
    <option value="grid">2 × 2</option>
    <option value="row">Isang hanay</option>
  </select>
  <button id="openAll" style="border-color:var(--accent)" title="Buksan lahat ng feed bilang popup na naka-tile sa screen">Buksan lahat (popup)</button>
  <button id="reloadAll">Reload lahat</button>
  <button id="edit">Feeds</button>
</header>
<main id="wall"></main>

<dialog id="dlg">
  <h2 style="margin:0 0 4px;font-size:16px">Feeds</h2>
  <p class="hint" style="margin-top:0">Ilagay ang pangalan at ang player link ng bawat cam. Iwanang blangko ang hindi gagamitin.</p>
  <div id="fields"></div>
  <div class="actions">
    <button id="cancel">Cancel</button>
    <button id="save" style="border-color:var(--accent)">Save feeds</button>
  </div>
</dialog>

<script>
const MAX = 4;
const DEFAULTS = [
  {name:"Main", url:"https://www.iwanttfc.com/player/09f9149f-acaa-42ca-a18f-5e2735f5de6a"},
  {name:"Dining room", url:""},
  {name:"External", url:""},
  {name:"", url:""}
];
let feeds = DEFAULTS, layout = "main";
try{
  feeds = JSON.parse(localStorage.getItem("mv-feeds")) || DEFAULTS;
  layout = localStorage.getItem("mv-layout") || "main";
}catch(e){}

const wall = document.getElementById("wall");
const layoutSel = document.getElementById("layout");
layoutSel.value = layout;

function render(){
  wall.className = "l-" + layoutSel.value;
  wall.innerHTML = "";
  const active = feeds.filter(f => f.url && f.url.trim());
  const list = active.length ? active : [{name:"", url:""}];
  list.slice(0, MAX).forEach((f, idx) => {
    const t = document.createElement("section");
    t.className = "tile";
    if(!f.url){
      t.innerHTML = '<div class="empty">Walang feed pa.<br>Pindutin ang "Feeds" para magdagdag.</div>';
    }else{
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.innerHTML = '<span class="dot"></span><span class="name"></span>';
      bar.querySelector(".name").textContent = f.name || "Feed";
      const mk = (label, fn, title) => {
        const b = document.createElement("button");
        b.textContent = label; b.title = title; b.onclick = fn; bar.appendChild(b);
      };
      const fr = document.createElement("iframe");
      fr.src = f.url;
      fr.allow = "autoplay; fullscreen; encrypted-media; picture-in-picture";
      fr.allowFullscreen = true;
      mk("Reload", () => { fr.src = f.url; }, "I-reload ang feed na ito");
      mk("Swap sa malaki", () => {
        const i = feeds.indexOf(f);
        if(i > 0){ [feeds[0], feeds[i]] = [feeds[i], feeds[0]]; persist(); render(); }
      }, "Gawing main (malaking tile)");
      mk("Full", () => { (fr.requestFullscreen || fr.webkitRequestFullscreen).call(fr); }, "Fullscreen");
      mk("Popup", () => openAt(f, idx, list.length), "Buksan sa hiwalay na window, naka-tile sa screen");
      t.append(bar, fr);
    }
    wall.appendChild(t);
  });
}

function activeFeeds(){ return feeds.filter(f => f.url && f.url.trim()).slice(0, MAX); }

function rectFor(i, n){
  const L = screen.availLeft || 0, T = screen.availTop || 0, W = screen.availWidth, H = screen.availHeight;
  const mode = layoutSel.value;
  let x = L, y = T, w = W, h = H;
  if(n > 1 && mode === "main"){
    const k = n - 1, mw = Math.round(W * 0.6);
    if(i === 0){ w = mw; }
    else { x = L + mw; w = W - mw; h = Math.round(H / k); y = T + (i - 1) * h; }
  }else if(n > 1 && mode === "grid"){
    const rows = Math.ceil(n / 2);
    w = Math.round(W / 2); h = Math.round(H / rows);
    x = L + (i % 2) * w; y = T + Math.floor(i / 2) * h;
  }else if(n > 1){
    w = Math.round(W / n); x = L + i * w;
  }
  return {x, y, w, h};
}

function openAt(f, i, n){
  const r = rectFor(i, n);
  const win = window.open(f.url, "mv-popup-" + i,
    "popup,left=" + r.x + ",top=" + r.y + ",width=" + r.w + ",height=" + r.h);
  if(!win) alert("Na-block ang popup. I-allow ang popups para sa page na ito sa address bar, tapos ulitin.");
}

function persist(){
  try{
    localStorage.setItem("mv-feeds", JSON.stringify(feeds));
    localStorage.setItem("mv-layout", layoutSel.value);
  }catch(e){}
}

const dlg = document.getElementById("dlg"), fields = document.getElementById("fields");
document.getElementById("edit").onclick = () => {
  fields.innerHTML = "";
  for(let i = 0; i < MAX; i++){
    const f = feeds[i] || {name:"", url:""};
    const r = document.createElement("div");
    r.className = "row";
    r.innerHTML = '<input placeholder="Pangalan" data-k="name"><input placeholder="https://www.iwanttfc.com/player/..." data-k="url">';
    r.children[0].value = f.name; r.children[1].value = f.url;
    fields.appendChild(r);
  }
  dlg.showModal();
};
document.getElementById("cancel").onclick = () => dlg.close();
document.getElementById("save").onclick = () => {
  feeds = [...fields.children].map(r => ({
    name: r.children[0].value.trim(),
    url: r.children[1].value.trim()
  }));
  persist(); render(); dlg.close();
};
layoutSel.onchange = () => { persist(); render(); };
document.getElementById("reloadAll").onclick = render;
document.getElementById("openAll").onclick = () => {
  const list = activeFeeds();
  list.forEach((f, i) => openAt(f, i, list.length));
};
render();
</script>
</body>
</html>
